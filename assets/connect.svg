<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
   <stop stop-color="#050812"/><stop offset=".5" stop-color="#12112A"/><stop offset="1" stop-color="#1A0A20"/>
 </linearGradient>
 <linearGradient id="rainbow" x1="0" x2="1">
   <stop stop-color="#22D3EE"><animate attributeName="stop-color" values="#22D3EE;#8B5CF6;#F472B6;#22D3EE" dur="7s" repeatCount="indefinite"/></stop>
   <stop offset=".5" stop-color="#8B5CF6"/>
   <stop offset="1" stop-color="#F472B6"><animate attributeName="stop-color" values="#F472B6;#FB923C;#22D3EE;#F472B6" dur="7s" repeatCount="indefinite"/></stop>
 </linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="12"/></filter>
 <pattern id="stars" width="70" height="70" patternUnits="userSpaceOnUse">
   <circle cx="8" cy="12" r="1.5" fill="#fff" opacity=".16"/>
   <circle cx="45" cy="40" r="1" fill="#22D3EE" opacity=".18"/>
   <circle cx="62" cy="20" r="1.2" fill="#F472B6" opacity=".14"/>
 </pattern>
</defs>

<rect width="1200" height="780" rx="34" fill="url(#bg)"/>
<rect width="1200" height="780" rx="34" fill="url(#stars)"/>

<circle cx="180" cy="120" r="150" fill="#22D3EE" opacity=".08" filter="url(#glow)">
 <animate attributeName="r" values="135;175;135" dur="6s" repeatCount="indefinite"/>
</circle>
<circle cx="1040" cy="650" r="190" fill="#F472B6" opacity=".08" filter="url(#glow)">
 <animate attributeName="r" values="175;215;175" dur="7s" repeatCount="indefinite"/>
</circle>

<rect x="34" y="34" width="1132" height="712" rx="28" fill="none" stroke="url(#rainbow)" stroke-width="2" opacity=".75"/>
<rect x="58" y="58" width="1084" height="664" rx="22" fill="none" stroke="#fff" stroke-opacity=".05"/>

<text x="600" y="118" text-anchor="middle" fill="#22D3EE" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="5">CONNECT / 05</text>

<text x="600" y="190" text-anchor="middle" fill="#F8FAFC" font-family="Arial,sans-serif" font-size="54" font-weight="800">LET'S BUILD</text>
<text x="600" y="250" text-anchor="middle" fill="#A78BFA" font-family="Arial,sans-serif" font-size="42" font-weight="700">SOMETHING GREAT.</text>

<text x="600" y="292" text-anchor="middle" fill="#94A3B8" font-family="Arial,sans-serif" font-size="18">
  Have an idea, collaboration or just want to say hello?
</text>

<!-- animated route -->
<path d="M205 395 C390 330, 510 455, 600 395 S810 330, 995 395"
      fill="none" stroke="url(#rainbow)" stroke-width="3" stroke-dasharray="8 12">
 <animate attributeName="stroke-dashoffset" from="0" to="-100" dur="3s" repeatCount="indefinite"/>
</path>

<circle cx="205" cy="395" r="9" fill="#22D3EE" filter="url(#glow)">
 <animate attributeName="r" values="7;12;7" dur="2s" repeatCount="indefinite"/>
</circle>
<circle cx="995" cy="395" r="9" fill="#F472B6" filter="url(#glow)">
 <animate attributeName="r" values="7;12;7" dur="2s" begin=".5s" repeatCount="indefinite"/>
</circle>

<!-- social cards -->
<g font-family="Arial,sans-serif" font-weight="700">
 <rect x="100" y="455" width="300" height="92" rx="22" fill="#fff" fill-opacity=".045" stroke="#fff" stroke-opacity=".12"/>
 <text x="130" y="493" fill="#94A3B8" font-size="12" letter-spacing="2">CODE</text>
 <text x="130" y="525" fill="#F8FAFC" font-size="22">⌘  GitHub</text>
 <text x="335" y="525" text-anchor="end" fill="#22D3EE" font-size="14">its-sarthak-27</text>

 <rect x="450" y="455" width="300" height="92" rx="22" fill="#fff" fill-opacity=".045" stroke="#fff" stroke-opacity=".12"/>
 <text x="480" y="493" fill="#94A3B8" font-size="12" letter-spacing="2">NETWORK</text>
 <text x="480" y="525" fill="#F8FAFC" font-size="22">in  LinkedIn</text>
 <text x="685" y="525" text-anchor="end" fill="#60A5FA" font-size="14">Connect</text>

 <rect x="800" y="455" width="300" height="92" rx="22" fill="#fff" fill-opacity=".045" stroke="#fff" stroke-opacity=".12"/>
 <text x="830" y="493" fill="#94A3B8" font-size="12" letter-spacing="2">LIFE / CREATIVITY</text>
 <text x="830" y="525" fill="#F8FAFC" font-size="22">◎ Instagram</text>
 <text x="1065" y="525" text-anchor="end" fill="#F472B6" font-size="14">@its.sarthak.27</text>
</g>

<!-- signature -->
<text x="600" y="615" text-anchor="middle" fill="#64748B" font-family="Arial,sans-serif" font-size="12" letter-spacing="4">ROOTED IN</text>
<text x="600" y="650" text-anchor="middle" fill="#FBBF24" font-family="Arial,sans-serif" font-size="25" font-weight="800">🪔 VARANASI • INDIA</text>

<text x="600" y="690" text-anchor="middle" fill="#CBD5E1" font-family="Arial,sans-serif" font-size="16">
  “See you in the next commit.”
</text>

<text x="600" y="715" text-anchor="middle" fill="#475569" font-family="Arial,sans-serif" font-size="11" letter-spacing="3">
  CURIOUS MIND • CREATIVE BUILDER • FUTURE FOCUSED
</text>
</svg>