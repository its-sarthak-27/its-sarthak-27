<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#060912"/><stop offset=".5" stop-color="#11102A"/><stop offset="1" stop-color="#170B20"/>
  </linearGradient>
  <linearGradient id="ring" x1="0" x2="1">
    <stop stop-color="#22D3EE"><animate attributeName="stop-color" values="#22D3EE;#8B5CF6;#F472B6;#22D3EE" dur="7s" repeatCount="indefinite"/></stop>
    <stop offset="1" stop-color="#F472B6"><animate attributeName="stop-color" values="#F472B6;#FB923C;#22D3EE;#F472B6" dur="7s" repeatCount="indefinite"/></stop>
  </linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="12"/></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="4"/></filter>
</defs>

<rect width="1200" height="820" rx="34" fill="url(#bg)"/>
<circle cx="600" cy="430" r="330" fill="none" stroke="#8B5CF6" stroke-opacity=".08" stroke-width="90" filter="url(#blur)"/>
<circle cx="600" cy="430" r="275" fill="none" stroke="url(#ring)" stroke-opacity=".28" stroke-width="2" stroke-dasharray="5 13">
  <animateTransform attributeName="transform" type="rotate" from="0 600 430" to="360 600 430" dur="22s" repeatCount="indefinite"/>
</circle>
<circle cx="600" cy="430" r="205" fill="none" stroke="#22D3EE" stroke-opacity=".18" stroke-width="2" stroke-dasharray="2 11">
  <animateTransform attributeName="transform" type="rotate" from="360 600 430" to="0 600 430" dur="16s" repeatCount="indefinite"/>
</circle>

<rect x="34" y="34" width="1132" height="752" rx="28" fill="none" stroke="url(#ring)" stroke-width="2" opacity=".65"/>
<text x="75" y="105" fill="#22D3EE" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="4">STACK / 02</text>
<text x="75" y="158" fill="#F8FAFC" font-family="Arial,sans-serif" font-size="44" font-weight="800">MY TECHNOLOGY UNIVERSE</text>
<text x="75" y="195" fill="#94A3B8" font-family="Arial,sans-serif" font-size="18">Tools I use to turn ideas into real products.</text>

<!-- center -->
<circle cx="600" cy="430" r="112" fill="#090D1A" stroke="url(#ring)" stroke-width="5" filter="url(#soft)"/>
<circle cx="600" cy="430" r="96" fill="#0D1223" stroke="#fff" stroke-opacity=".08"/>
<text x="600" y="414" text-anchor="middle" fill="#64748B" font-family="Arial,sans-serif" font-size="12" letter-spacing="3">SARTHAK</text>
<text x="600" y="448" text-anchor="middle" fill="#F8FAFC" font-family="Arial,sans-serif" font-size="27" font-weight="800">BUILD</text>
<text x="600" y="477" text-anchor="middle" fill="#A78BFA" font-family="Arial,sans-serif" font-size="14">LEARN • CREATE • SHIP</text>

<!-- orbit labels -->
<g font-family="Arial,sans-serif" font-weight="700">
  <g transform="translate(600 155)">
    <rect x="-82" y="-27" width="164" height="54" rx="27" fill="#22D3EE" fill-opacity=".10" stroke="#22D3EE" stroke-opacity=".6"/>
    <text y="7" text-anchor="middle" fill="#67E8F9" font-size="17">🐍 PYTHON</text>
  </g>
  <g transform="translate(855 270)">
    <rect x="-86" y="-27" width="172" height="54" rx="27" fill="#8B5CF6" fill-opacity=".10" stroke="#8B5CF6" stroke-opacity=".6"/>
    <text y="7" text-anchor="middle" fill="#C4B5FD" font-size="17">⚛ REACT</text>
  </g>
  <g transform="translate(875 570)">
    <rect x="-86" y="-27" width="172" height="54" rx="27" fill="#F472B6" fill-opacity=".10" stroke="#F472B6" stroke-opacity=".6"/>
    <text y="7" text-anchor="middle" fill="#F9A8D4" font-size="17">🟢 NODE.JS</text>
  </g>
  <g transform="translate(600 700)">
    <rect x="-91" y="-27" width="182" height="54" rx="27" fill="#FB923C" fill-opacity=".10" stroke="#FB923C" stroke-opacity=".6"/>
    <text y="7" text-anchor="middle" fill="#FDBA74" font-size="17">🍃 MONGODB</text>
  </g>
  <g transform="translate(325 570)">
    <rect x="-82" y="-27" width="164" height="54" rx="27" fill="#34D399" fill-opacity=".10" stroke="#34D399" stroke-opacity=".6"/>
    <text y="7" text-anchor="middle" fill="#6EE7B7" font-size="17">🌐 GIT</text>
  </g>
  <g transform="translate(345 270)">
    <rect x="-88" y="-27" width="176" height="54" rx="27" fill="#FBBF24" fill-opacity=".10" stroke="#FBBF24" stroke-opacity=".6"/>
    <text y="7" text-anchor="middle" fill="#FDE68A" font-size="17">🎨 TAILWIND</text>
  </g>
</g>

<!-- orbiting dots -->
<circle cx="600" cy="155" r="6" fill="#22D3EE">
  <animate attributeName="cy" values="155;165;155" dur="2.5s" repeatCount="indefinite"/>
</circle>
<circle cx="855" cy="270" r="6" fill="#A78BFA">
  <animate attributeName="r" values="4;8;4" dur="2s" repeatCount="indefinite"/>
</circle>
<circle cx="875" cy="570" r="6" fill="#F472B6">
  <animate attributeName="cy" values="570;558;570" dur="2.7s" repeatCount="indefinite"/>
</circle>

<!-- side capability cards -->
<g font-family="Arial,sans-serif">
  <rect x="70" y="270" width="190" height="170" rx="24" fill="#fff" fill-opacity=".035" stroke="#fff" stroke-opacity=".10"/>
  <text x="95" y="310" fill="#22D3EE" font-size="13" font-weight="700" letter-spacing="2">AI / ML</text>
  <text x="95" y="344" fill="#E2E8F0" font-size="16">Computer Vision</text>
  <text x="95" y="374" fill="#CBD5E1" font-size="16">Deep Learning</text>
  <text x="95" y="404" fill="#CBD5E1" font-size="16">Intelligent Systems</text>

  <rect x="940" y="270" width="190" height="170" rx="24" fill="#fff" fill-opacity=".035" stroke="#fff" stroke-opacity=".10"/>
  <text x="965" y="310" fill="#F472B6" font-size="13" font-weight="700" letter-spacing="2">FRONTEND</text>
  <text x="965" y="344" fill="#E2E8F0" font-size="16">Modern React</text>
  <text x="965" y="374" fill="#CBD5E1" font-size="16">Vite + Tailwind</text>
  <text x="965" y="404" fill="#CBD5E1" font-size="16">Motion & UI</text>
</g>

<text x="600" y="755" text-anchor="middle" fill="#475569" font-family="Arial,sans-serif" font-size="12" letter-spacing="3">AI • WEB • DESIGN • DATA • OPEN SOURCE</text>
</svg>