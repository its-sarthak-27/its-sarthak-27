<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050812"/><stop offset=".5" stop-color="#111329"/><stop offset="1" stop-color="#190B20"/></linearGradient>
 <linearGradient id="rainbow"><stop stop-color="#22D3EE"><animate attributeName="stop-color" values="#22D3EE;#8B5CF6;#F472B6;#22D3EE" dur="8s" repeatCount="indefinite"/></stop><stop offset=".5" stop-color="#8B5CF6"/><stop offset="1" stop-color="#F472B6"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="10"/></filter>
</defs>
<rect width="1200" height="900" rx="34" fill="url(#bg)"/>
<circle cx="1000" cy="100" r="180" fill="#8B5CF6" opacity=".1" filter="url(#glow)"/>
<circle cx="150" cy="780" r="200" fill="#22D3EE" opacity=".07" filter="url(#glow)"/>
<rect x="34" y="34" width="1132" height="832" rx="28" fill="none" stroke="url(#rainbow)" stroke-width="2" opacity=".7"/>

<text x="75" y="105" fill="#22D3EE" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="4">ANALYTICS / 04</text>
<text x="75" y="160" fill="#F8FAFC" font-family="Arial,sans-serif" font-size="46" font-weight="800">GITHUB ACTIVITY</text>
<text x="75" y="198" fill="#94A3B8" font-family="Arial,sans-serif" font-size="18">A visual snapshot of my coding journey.</text>

